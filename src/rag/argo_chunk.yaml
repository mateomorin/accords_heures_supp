apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: legifrance-embed-parts-
spec:
  entrypoint: main-dag
  parallelism: 1
  arguments:
    parameters:
      - name: collection
        value: "accords_heures_supp_parts"
  ttlStrategy:
    secondsAfterCompletion: 86400
  podGC:
    strategy: OnPodSuccess

  templates:
    - name: main-dag
      dag:
        tasks:
          - name: embed-parts
            template: embed-cpu
            arguments:
              parameters:
                - name: collection
                  value: "{{workflow.parameters.collection}}"

    - name: embed-cpu
      inputs:
        parameters:
          - name: collection
      # If the pod crashes (OOM, node eviction, network error, ...), Argo restarts it.
      # Per-shard checkpoints (.done on S3) and deterministic point ids make the run
      # resumable and idempotent: only unfinished shards are reprocessed, without duplicates.
      retryStrategy:
        limit: 3
        retryPolicy: "Always"
        backoff:
          duration: "30s"
          factor: "2"
      script:
        image: "inseefrlab/onyxia-vscode-python:py3.13.5"
        imagePullPolicy: Always
        command: ["/bin/bash"]
        source: |
          set -euo pipefail

          git clone --depth 1 -b feature/structured_rag https://github.com/mateomorin/accords_heures_supp.git
          cd accords_heures_supp

          echo "Chunking + embeddings of the v2 parts into {{inputs.parameters.collection}}..."
          uv run src/rag/embed_chunks.py \
            --collection "{{inputs.parameters.collection}}" \
            --embed_concurrency 10
        resources:
          limits:
            cpu: "4000m"
            memory: "16Gi"
          requests:
            cpu: "1000m"
            memory: "4Gi"
        env:
          - name: LLM_API_URL
            valueFrom: { secretKeyRef: { name: llm-lab-api, key: LLM_API_URL } }
          - name: LLM_API_KEY
            valueFrom: { secretKeyRef: { name: llm-lab-api, key: LLM_API_KEY } }
          - name: AWS_ACCESS_KEY_ID
            valueFrom: { secretKeyRef: { name: s3-creds-legifrance, key: AWS_ACCESS_KEY_ID } }
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom: { secretKeyRef: { name: s3-creds-legifrance, key: AWS_SECRET_ACCESS_KEY } }
          - name: AWS_SESSION_TOKEN
            valueFrom: { secretKeyRef: { name: s3-creds-legifrance, key: AWS_SESSION_TOKEN } }
          - name: QDRANT_API_URL
            valueFrom: { secretKeyRef: { name: qdrant-creds, key: QDRANT_API_URL, optional: true } }
          - name: QDRANT_API_KEY
            valueFrom: { secretKeyRef: { name: qdrant-creds, key: QDRANT_API_KEY, optional: true } }
