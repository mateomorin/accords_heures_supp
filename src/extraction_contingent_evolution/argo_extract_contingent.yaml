apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: legifrance-extract-contingent-
spec:
  entrypoint: main-dag
  parallelism: 2
  templates:
    - name: main-dag
      dag:
        tasks:
          - name: extract-year
            template: extract-cpu
            arguments:
              parameters:
                - name: year
                  value: "{{item}}"
                - name: concurrency
                  value: "10"
            withItems: [2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]

    - name: extract-cpu
      inputs:
        parameters:
          - name: year
          - name: concurrency
      retryStrategy:
        limit: 3
        retryPolicy: "Always"
        backoff:
          duration: "30s"
          factor: "2"
      script:
        image: "inseefrlab/onyxia-vscode-python:py3.13.5"
        imagePullPolicy: Always
        command: ["/bin/bash"]
        source: |
          set -e

          git clone https://github.com/mateomorin/accords_heures_supp.git
          cd accords_heures_supp

          echo "Extraction du contingent pour l'année {{inputs.parameters.year}}..."
          uv run python src/extraction_contingent/extract_contingent.py \
            --years {{inputs.parameters.year}} \
            --concurrency {{inputs.parameters.concurrency}}
        resources:
          limits:
            cpu: "2000m"
            memory: "8Gi"
          requests:
            cpu: "500m"
            memory: "2Gi"
        env:
          - name: LLM_API_URL
            valueFrom: { secretKeyRef: { name: llm-lab-api, key: LLM_API_URL } }
          - name: LLM_API_KEY
            valueFrom: { secretKeyRef: { name: llm-lab-api, key: LLM_API_KEY } }
          - name: QDRANT_API_URL
            valueFrom: { secretKeyRef: { name: qdrant-creds, key: QDRANT_API_URL, optional: true } }
          - name: QDRANT_API_KEY
            valueFrom: { secretKeyRef: { name: qdrant-creds, key: QDRANT_API_KEY, optional: true } }
          - name: AWS_ACCESS_KEY_ID
            valueFrom: { secretKeyRef: { name: s3-creds-legifrance, key: AWS_ACCESS_KEY_ID } }
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom: { secretKeyRef: { name: s3-creds-legifrance, key: AWS_SECRET_ACCESS_KEY } }
          - name: AWS_SESSION_TOKEN
            valueFrom: { secretKeyRef: { name: s3-creds-legifrance, key: AWS_SESSION_TOKEN } }