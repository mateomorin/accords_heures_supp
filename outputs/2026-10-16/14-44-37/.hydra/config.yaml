args:
  type: contingent
  year: 2023
  top_k: 5
  concurrency: 5
  shard_size: 200
  skip_existing: true
  llm_retries: 4
  limit: 20
data_storage:
  base_dir: s3://mateomorin/legifrance
  metadata_path: ${data_storage.base_dir}/metadata/acco_metadata_${args.year}.parquet
  extraction_dir: ${data_storage.base_dir}/extraction/${args.type}/year=${args.year}
vector_storage:
  qdrant_collection: accords_heures_supp
  year_key: metadata.anneeSignature
  ref_key: metadata.reference
  timeout: 60
prompts:
  prompt_dir: prompts/contingent
  query_file: ${prompts.prompt_dir}/query.txt
  system_prompt_file: ${prompts.prompt_dir}/system_prompt.txt
  user_prompt_file: ${prompts.prompt_dir}/user_prompt.txt
llm:
  embedding_model: qwen3-embedding-8b
  llm_model: gemma4-26b-moe
  temperature: 0
  timeout: 120
